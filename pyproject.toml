[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-reattribute"
version = "0.1.0"
description = "Interactively replace one Git contributor identity with another, safely."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "git-reattribute contributors" }]
keywords = ["git", "cli", "history", "rewrite", "attribution"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "git-filter-repo>=2.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
git-reattribute = "git_reattribute.cli:app"

[project.urls]
Homepage = "https://github.com/drk1rd/git-reattribute"
Issues = "https://github.com/drk1rd/git-reattribute/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/git_reattribute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
